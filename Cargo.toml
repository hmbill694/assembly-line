[package]
name = "assembly-line"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[lib]
name = "assembly_line"
path = "src/lib.rs"

[[bin]]
name = "assembly"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "signal", "sync"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Lints live here rather than in CI flags, so `cargo clippy` in an editor sees
# exactly what the justfile and CI see.
#
# `missing_errors_doc`, `missing_panics_doc`, and `must_use_candidate` are
# deliberately left on: this codebase is edited by agents that have no author
# context, so documenting when a call fails and making a dropped return a
# compile error are worth more here than in a hand-maintained crate.
#
# The two opt-outs below exist only because they contradict the house style in
# CLAUDE.md. Anything else is expected to be fixed rather than silenced.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Iterator combinators are preferred over `for` loops.
needless_for_each = "allow"
# Two-way branches are written as `match` for symmetry with neighbouring
# matches on enums.
match_bool = "allow"
# Building a fixture string with `.map(format!).collect()` reads better than
# folding into a buffer, and these strings are a handful of lines long.
format_collect = "allow"
